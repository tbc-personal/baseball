<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #f4eee0; font-family: 'Courier Prime', 'Courier New', monospace; color: #23292d; }
    a { color: #b5402c; } a:hover { color: #8f3222; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 20px 20px; background-color: #f4eee0; background-image: repeating-linear-gradient(0deg, transparent 0px, transparent 27px, rgba(35,41,45,0.05) 27px, rgba(35,41,45,0.05) 28px); display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

  <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #23292d; padding-bottom: 8px;">
    <div style="display: flex; flex-direction: row; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;">Herons</span>
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 600; color: #b5402c;">2</span>
    </div>
    <div style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f6a;">Bot 4th</div>
    <div style="display: flex; flex-direction: row; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 600;">3</span>
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;">Otters</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px;">
    <svg width="196" height="170" viewBox="0 0 200 170" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
      <path d="M100 150 L172 88 L100 26 L28 88 Z" stroke="#23292d" stroke-width="1.5" fill="none"></path>
      <path d="M40 100 A 85 85 0 0 1 160 100" stroke="#23292d" stroke-width="1" stroke-dasharray="3 4" fill="none"></path>
      <circle cx="100" cy="88" r="6" stroke="#23292d" stroke-width="1.5" fill="none"></circle>
      <rect x="163" y="79" width="18" height="18" transform="rotate(45 172 88)" fill="#b5402c" stroke="#23292d" stroke-width="1.5"></rect>
      <rect x="91" y="17" width="18" height="18" transform="rotate(45 100 26)" fill="#f4eee0" stroke="#23292d" stroke-width="1.5"></rect>
      <rect x="19" y="79" width="18" height="18" transform="rotate(45 28 88)" fill="#b5402c" stroke="#23292d" stroke-width="1.5"></rect>
      <path d="M90 143 L110 143 L110 151 L100 160 L90 151 Z" fill="#f4eee0" stroke="#23292d" stroke-width="1.5"></path>
      <text x="172" y="120" text-anchor="middle" font-family="Courier Prime, Courier New, monospace" font-size="11" fill="#6b6f6a">Okafor</text>
      <text x="28" y="120" text-anchor="middle" font-family="Courier Prime, Courier New, monospace" font-size="11" fill="#6b6f6a">Vill.</text>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; align-items: flex-end;">
      <div style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 44px; font-weight: 500; line-height: 1;">2–1</div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
        <div style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
          <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f6a;">Balls</span>
          <div style="display: flex; flex-direction: row; gap: 5px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #23292d; background: #23292d;"></div>
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #23292d; background: #23292d;"></div>
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #23292d; background: transparent;"></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
          <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f6a;">Strikes</span>
          <div style="display: flex; flex-direction: row; gap: 5px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #b5402c; background: #b5402c;"></div>
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #b5402c; background: transparent;"></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: row; gap: 8px; align-items: center;">
          <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f6a;">Outs</span>
          <div style="display: flex; flex-direction: row; gap: 5px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #23292d; background: #23292d;"></div>
            <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #23292d; background: transparent;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="border: 1.5px solid #23292d; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.35);">
    <div style="display: flex; flex-direction: row; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f6a;">
      <span>At bat · 3rd in order</span>
      <span>.281 · 4 HR</span>
    </div>
    <div style="display: flex; flex-direction: row; align-items: baseline; gap: 10px;">
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 500;">Sam Achterberg</span>
      <span style="font-size: 14px; color: #6b6f6a;">RF</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: row; justify-content: space-between; border-top: 1px solid #cdc4ad; padding-top: 6px;"><span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6f6a;">Contact</span><span style="font-weight: 700; font-size: 15px;">55</span></div>
      <div style="display: flex; flex-direction: row; justify-content: space-between; border-top: 1px solid #cdc4ad; padding-top: 6px;"><span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6f6a;">Power</span><span style="font-weight: 700; font-size: 15px;">65</span></div>
      <div style="display: flex; flex-direction: row; justify-content: space-between; border-top: 1px solid #cdc4ad; padding-top: 6px;"><span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6f6a;">Eye</span><span style="font-weight: 700; font-size: 15px;">55</span></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6f6a;">Read on Delgado</span>
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 500; color: #b5402c;">Likely strike</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
      <div style="display: flex; flex-direction: row; gap: 4px;">
        <div style="width: 22px; height: 8px; background: #b5402c;"></div>
        <div style="width: 22px; height: 8px; background: #b5402c;"></div>
        <div style="width: 22px; height: 8px; background: #b5402c;"></div>
      </div>
      <span style="font-size: 11px; color: #6b6f6a;">Attacker · 61 pitches</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="height: 60px; display: flex; align-items: center; justify-content: center; border: 2px solid #23292d; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; background: #f4eee0;">Take</div>
      <div style="height: 60px; display: flex; align-items: center; justify-content: center; border: 2px solid #23292d; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; background: #f4eee0;">Contact</div>
      <div style="height: 60px; display: flex; align-items: center; justify-content: center; border: 2px solid #23292d; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; background: #23292d; color: #f4eee0;">Power</div>
    </div>
    <div style="height: 48px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed #6b6f6a; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6f6a;">Bunt · runners on</div>
  </div>

  <div style="margin-top: auto; border-left: 3px solid #b5402c; padding-left: 12px; font-style: italic; font-size: 14px; line-height: 1.45; color: #23292d;">Villanueva singles to left. Okafor to third.</div>

</div>
</x-dc>
</body>
</html>
